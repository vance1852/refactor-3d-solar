<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D 建筑楼层查看器</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background: #1a1a2e;
      }
      canvas {
        display: block;
      }
      #info-panel {
        position: absolute;
        top: 20px;
        left: 20px;
        color: #fff;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 14px;
        pointer-events: none;
        background: rgba(0, 0, 0, 0.65);
        padding: 14px 18px;
        border-radius: 10px;
        min-width: 180px;
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      #controls {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
      }
      #controls button {
        padding: 8px 18px;
        background: rgba(255, 255, 255, 0.1);
        color: #ccc;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-family: "Segoe UI", system-ui, sans-serif;
        transition: all 0.2s;
      }
      #controls button:hover {
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
      }
      #controls button.active {
        background: rgba(80, 140, 255, 0.35);
        border-color: #5a9eff;
        color: #fff;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-Dzhx9Kec.js"></script>
  </head>
  <body>
    <div id="info-panel">建筑楼层查看器</div>
    <div id="controls">
      <button id="btn-explode">爆炸视图</button>
      <button id="btn-furniture" class="active">家具</button>
      <button id="btn-heatmap">热力图</button>
      <button id="btn-reset">重置</button>
    </div>
  </body>
</html>
